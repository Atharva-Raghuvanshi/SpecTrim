[project]
name = "query-optimizer"
version = "0.1.0"
description = "Spec agent + token-optimizing proxy/MCP layer between coding agents and LLMs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "litellm>=1.52",
    "pyyaml>=6.0.1",
    "openapi-spec-validator>=0.7",
    "psycopg[binary,pool]>=3.1",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["server/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
