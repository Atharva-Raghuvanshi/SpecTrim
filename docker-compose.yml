services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-qo}
    ports:
      - "${QO_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-qo}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/qo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-change-me}
      SPEND_CAP_USD_PER_DAY: ${SPEND_CAP_USD_PER_DAY:-10}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "${QO_API_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status == 200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker_main"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/qo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import psycopg, os; psycopg.connect(os.environ['DATABASE_URL'], connect_timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mcp:
    build: .
    command: ["python", "-m", "app.mcp_server"]
    environment:
      API_BASE: http://api:8000
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-change-me}
      MCP_TRANSPORT: streamable-http
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${QO_MCP_PORT:-8002}:8001"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROM_HOST_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
