# Stage -> model settings (FR-24). Versions pinned. Selected by ACTIVE_CONFIG (env wins).
# Groq free tier via LiteLLM: model strings are "groq/<model-id>".
active: single_model
configs:
  single_model:
    default:
      model: groq/openai/gpt-oss-120b
      temperature: 0.2
      max_tokens: 4096
      fallback_model: groq/openai/gpt-oss-20b
    stages:
      analyzer:
        model: groq/openai/gpt-oss-120b
        temperature: 0.1
        max_tokens: 4096
      classifier:
        model: groq/openai/gpt-oss-20b
        temperature: 0.0
        max_tokens: 1024
      question_gate:
        model: groq/openai/gpt-oss-20b
        temperature: 0.0
        max_tokens: 1024
      spec_writer:
        model: groq/openai/gpt-oss-120b
        temperature: 0.2
        max_tokens: 8192
      decomposer:
        model: groq/openai/gpt-oss-120b
        temperature: 0.2
        max_tokens: 8192
      contract:
        model: groq/openai/gpt-oss-120b
        temperature: 0.1
        max_tokens: 8192
      revision:
        model: groq/openai/gpt-oss-120b
        temperature: 0.2
        max_tokens: 8192
